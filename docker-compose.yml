services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    entrypoint: []
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

    # unless-stopped: restarts after crashes but not after docker compose stop
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_analyst
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # Allow the Vite dev server running in the frontend container
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: storage
      ALLOWED_FILE_TYPES: csv,xlsx,xls,json,parquet,pdf

    depends_on:
      - postgres
      - redis
      - chromadb

    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./logs:/app/logs
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      target: development

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  redis:
    image: redis:7

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  chromadb:
    # Explicitly select a reviewed pin; never downgrade an existing volume implicitly.
    image: ${CHROMA_IMAGE:?Set an approved pinned Chroma image after compatibility and backup verification}

    ports:
      - "8401:8000"

    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma

    volumes:
      - chroma_data:/chroma/chroma

    restart: unless-stopped

networks:
  default:
    name: ai-analyst-network

volumes:
  postgres_data:
  frontend_node_modules:
  chroma_data:

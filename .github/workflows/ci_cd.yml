name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# ─── Permissions ─────────────────────────────────────────────────────────────
# Least-privilege: read-only repository access; no production credentials.
permissions:
  contents: read
  checks: write
  pull-requests: write

# ─── Cancel in-progress runs for the same branch/PR ─────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Automated Unit & Integration Tests
  # Runs all deterministic backend tests against an isolated PostgreSQL service.
  # torch is excluded from this job via ci-requirements.txt to keep install
  # time under 2 minutes. Embedding-dependent tests are skipped via
  # SKIP_EMBEDDING_TESTS=true.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: analyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # ── Isolated test database — never touches customer storage ──────────
      DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/analyst_test
      ENVIRONMENT: test
      DEBUG: "false"
      # ── Minimal required secrets (safe placeholder values for CI) ────────
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production
      # ── Skip sentence-transformers/torch-dependent code paths ────────────
      SKIP_EMBEDDING_TESTS: "true"
      # ── Disable outbound LLM calls in unit tests ─────────────────────────
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      # ── Redis not required for unit tests; use memory stub ────────────────
      REDIS_URL: "redis://localhost:6379/0"
      # ── Make backend importable as `from backend.app...` ─────────────────
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/ci-requirements.txt

      - name: Install CI dependencies (torch-free, fast)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/ci-requirements.txt

      - name: Run migrations on isolated test database
        run: |
          python -m alembic upgrade head

      - name: Run backend tests with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — PostgreSQL Migration and Dataset Isolation Contract
  # Validates every migration revision, schema contract, and multi-tenant
  # dataset isolation against a disposable PostgreSQL database.
  # Uses ci-requirements.txt (no torch) to keep install time low.
  # ──────────────────────────────────────────────────────────────────────────
  migration-contract:
    name: PostgreSQL Migration and Dataset Isolation Contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: analyst_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/analyst_migration_test
      ISOLATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/analyst_migration_test
      ENVIRONMENT: test
      DEBUG: "false"
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production
      SKIP_EMBEDDING_TESTS: "true"
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      REDIS_URL: "redis://localhost:6379/0"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/ci-requirements.txt

      - name: Install CI dependencies (torch-free, fast)
        run: pip install -r backend/ci-requirements.txt

      - name: Run fresh migration to head
        run: python -m alembic upgrade head

      - name: Verify idempotent re-upgrade (must be a no-op)
        run: python -m alembic upgrade head

      - name: Run schema preflight
        run: python scripts/schema_preflight.py

      - name: Run schema contract and dataset isolation tests
        run: |
          pytest \
            tests/test_schema_contract.py \
            tests/test_recommendation_schema_reconciliation.py \
            tests/test_authenticated_dataset_isolation.py \
            -v --tb=short -q

      - name: Upload migration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results
          path: "*.xml"
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security & Vulnerability Scan
  # Runs after both test jobs pass. Only uses bandit + pip-audit;
  # no production credentials required.
  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test, migration-contract]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: |
          pip install bandit pip-audit

      - name: Bandit SAST scan (medium severity and above)
        run: bandit -r backend/app -ll --skip B101

      - name: Dependency vulnerability audit
        run: pip-audit -r backend/ci-requirements.txt --ignore-vuln PYSEC-2024-68

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build & Verify Docker Image
  # Runs after security scan. Build only; image is never pushed here.
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          # Dockerfile lives at backend/Dockerfile but uses paths relative to
          # the repo root (COPY backend/requirements.txt ...), so context must
          # be the repository root.
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ai-data-analyst-os-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5 — Zero-Downtime Production Deployment
  # Only runs on main branch merges after the full pipeline passes.
  # Production environment requires manual approval in GitHub Environments.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying release ${{ github.sha }} to production cluster..."
          # python scripts/deploy.py --version ${{ github.sha }}

      - name: Post-deploy health check
        run: |
          echo "Health check placeholder — configure real endpoint in production."
          # curl -f https://api.aidataanalyst.com/api/v1/health || exit 1

      - name: Automated rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — initiating rollback."
          # python scripts/rollback.py

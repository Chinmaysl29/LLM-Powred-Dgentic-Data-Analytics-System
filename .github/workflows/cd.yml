name: Continuous Deployment & Release Pipeline

# This workflow provides an independent release gate triggered only on pushes
# to main. It installs from the correct requirements path, runs the backend
# test suite against an isolated database, then builds the Docker image from
# the repository root (required because the Dockerfile uses paths relative to
# the repo root, e.g. COPY backend/requirements.txt ...).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # Never cancel an in-progress release

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — test_and_build
  # Installs from backend/requirements.txt (ci-requirements.txt for speed),
  # runs tests against an isolated PostgreSQL service, then builds Docker.
  # ──────────────────────────────────────────────────────────────────────────
  test_and_build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: analyst_cd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/analyst_cd_test
      ENVIRONMENT: test
      DEBUG: "false"
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production
      SKIP_EMBEDDING_TESTS: "true"
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      REDIS_URL: "redis://localhost:6379/0"
      # backend must be importable as `from backend.app...`
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/ci-requirements.txt

      - name: Install dependencies
        # Use ci-requirements.txt (no torch, fast). Full requirements.txt
        # is used only inside the Docker image build itself.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/ci-requirements.txt

      - name: Run migrations on isolated test database
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: |
          pytest backend/tests/ \
            -v \
            --tb=short \
            -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Context is repo root because backend/Dockerfile contains:
        #   COPY backend/requirements.txt backend/requirements.txt
        # which requires the repo root as the build context.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: analystos/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — deploy_staging
  # Only runs after test_and_build succeeds.
  # ──────────────────────────────────────────────────────────────────────────
  deploy_staging:
    name: Deploy to Staging
    needs: test_and_build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Staging Cluster
        run: echo "Deploying ${{ github.sha }} to Staging..."

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — deploy_production_canary
  # Requires staging to pass. Production environment requires GitHub approval.
  # ──────────────────────────────────────────────────────────────────────────
  deploy_production_canary:
    name: Production Canary Deploy
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Canary Deploy 10%
        run: echo "Canary deployment initialized for ${{ github.sha }}..."

      - name: Validate Health Checks
        run: echo "Probing liveness and readiness endpoints..."

      - name: Promote to 100% Traffic
        run: echo "Traffic promoted to 100%."

[pytest]
# ─── Test discovery ───────────────────────────────────────────────────────────
# Backend unit/integration tests: backend/tests/
# Migration & isolation contract tests: tests/
testpaths = backend/tests tests

# ─── Minimum version ──────────────────────────────────────────────────────────
minversion = 8.0

# ─── asyncio mode ─────────────────────────────────────────────────────────────
asyncio_mode = auto

# ─── Short traceback for CI readability ───────────────────────────────────────
addopts =
    --tb=short
    -q

# ─── Warning filters ──────────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::PendingDeprecationWarning

# ─── Markers ──────────────────────────────────────────────────────────────────
markers =
    migration: requires a live migrated PostgreSQL database
    isolation: verifies multi-tenant dataset isolation contracts
    schema: verifies schema compatibility via inspect_schema()
    slow: marks tests as slow (skipped with -m "not slow")
    embedding: requires torch/sentence-transformers (skipped when SKIP_EMBEDDING_TESTS=true)

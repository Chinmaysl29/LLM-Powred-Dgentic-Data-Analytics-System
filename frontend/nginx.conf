# Production Nginx Configuration for AI Data Analyst OS Frontend

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads for datasets (CSV, Excel, Parquet, PDF)
    client_max_body_size 300M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── Docker internal DNS resolver ───────────────────────────────────────────
    # Resolves upstream services dynamically at runtime without crashing at startup
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    # ── Static fingerprinted assets (immutable cache) ──────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Favicons and public assets ─────────────────────────────────────────────
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Health check endpoint for container / orchestrator ─────────────────────
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── API reverse proxy to FastAPI backend ───────────────────────────────────
    location /api/v1/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # WebSocket / SSE connection upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for long-running AI queries, data profiling, model training
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable caching for API responses
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        # Preserve backend error responses (do not show generic Nginx error pages)
        proxy_intercept_errors off;
    }

    # ── SPA fallback routing (deep links survive refresh) ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Do not cache index.html indefinitely (ensures new releases load) ───────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}

services:
  # Backend API Service
  - type: web
    name: ai-data-analyst-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-data-analyst-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-data-analyst-redis
          property: connectionString
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/chroma
      - key: FRONTEND_URL
        value: https://ai-data-analyst.vercel.app
      - key: CORS_ORIGINS
        value: https://ai-data-analyst.vercel.app
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: ai-data-analyst-storage
      mountPath: /var/data
      sizeGB: 50

databases:
  # Managed PostgreSQL (Compatible with Neon / Supabase / AWS RDS)
  - name: ai-data-analyst-db
    region: oregon
    plan: standard
    postgresMajorVersion: 16

  # Redis Cache & Task Queue
  - name: ai-data-analyst-redis
    region: oregon
    plan: standard
    maxmemoryPolicy: allkeys-lru

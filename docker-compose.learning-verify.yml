# Use after docker-compose.verify.yml, always with a dedicated -p project.
services:
  frontend-verify:
    image: dataanalyst-frontend:latest
    working_dir: /app
    command: npm run dev -- --config vite.learning-verify.config.ts
    environment:
      VITE_API_BASE_URL: http://frontend-verify:5173
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    volumes:
      - ./frontend:/app
      - verify_frontend_modules:/app/node_modules
  browser:
    image: dataanalyst-learning-browser:latest
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.learning-browser
    working_dir: /app
    command: node scripts/run-learning-browser.mjs
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - ./frontend:/app
      - verify_frontend_modules:/app/node_modules
      - verify_storage:/verification
      - browser_cache:/root/.cache/ms-playwright
volumes:
  verify_frontend_modules:
  browser_cache:
    external: true
    name: dataanalyst_dev_browser_cache
